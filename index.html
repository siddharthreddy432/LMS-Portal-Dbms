<!doctype html>
<html lang="en">
  <head>
    <script>
      // Prevent libraries from crashing if they try to polyfill or set window.fetch
      // AI Studio might define it as a getter-only property.
      (function() {
        try {
          const originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function() { console.warn("Ignored attempt to overwrite window.fetch"); },
            configurable: true
          });
          Object.defineProperty(globalThis, 'fetch', {
            get: function() { return originalFetch; },
            set: function() { console.warn("Ignored attempt to overwrite globalThis.fetch"); },
            configurable: true
          });
        } catch(e) {
          console.error("Could not patch window.fetch", e);
        }
      })();
      // Prevent Flash of Wrong Theme (FOUC)
      (function() {
        try {
          var theme = localStorage.getItem('klh-theme');
          var isDark = false;
          if (theme === 'dark') {
            isDark = true;
          } else if (theme === 'light') {
            isDark = false;
          } else {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch(e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KL Underground | The Modern Student Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  </head>
  <body class="min-h-screen bg-[var(--bg-main)] text-[var(--text-primary)] transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
